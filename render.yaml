services:
  - type: web
    name: air-quality-pipeline
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:server --workers 2 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: HOST
        value: 0.0.0.0
      - key: DEBUG
        value: "false"
